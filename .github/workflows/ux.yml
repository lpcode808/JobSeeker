name: UX tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e397a739b05982f66194afa475604061c7 # v4.1.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@967fb199eaf2a50c5af7696c79a44975c002341 # v4.0.0
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run UX tests
        run: pnpm run test:e2e
